<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Школьный Блиц-Опрос</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: #fff;
            overflow-x: hidden;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-image 0.8s ease-in-out;
        }

        /* Тёмное перекрытие для чёткости текста */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(3px);
            z-index: -1;
        }

        .screen { display: none; }
        .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

        .center-box { min-height: 85vh; text-align: center; }
        .card-box {
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.25); border-radius: 24px; padding: 40px;
            max-width: 650px; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        }

        .banner-img {
            width: 100%; height: 260px; object-fit: cover; border-radius: 18px; margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.3);
            transition: all 0.5s ease;
        }

        .btn-main {
            background: linear-gradient(45deg, #ff4757, #ffa502); color: white; font-size: 1.6rem; font-weight: 800;
            padding: 16px 45px; border-radius: 50px; cursor: pointer; border: none; box-shadow: 0 8px 25px rgba(255, 71, 87, 0.5);
            transition: all 0.2s ease; margin: 8px;
        }
        .btn-main:hover { transform: scale(1.06); box-shadow: 0 12px 30px rgba(255, 71, 87, 0.7); }

        .btn-lang {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            font-size: 1.25rem; padding: 18px 30px; border-radius: 20px; border: 2px solid rgba(255,255,255,0.3);
            color: white; font-weight: 800; cursor: pointer; margin: 8px; transition: 0.3s;
        }
        .btn-lang:hover { transform: scale(1.08); border-color: #f59e0b; }

        .form-group { width: 100%; text-align: left; margin-bottom: 20px; }
        .form-group label { font-size: 0.95rem; font-weight: 700; color: #cbd5e1; display: block; margin-bottom: 8px; }
        select, input {
            width: 100%; padding: 14px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.2);
            background: rgba(15, 23, 42, 0.9); color: #fff; font-size: 1rem; font-family: inherit; outline: none;
        }

        #game_screen { display: none; padding-top: 130px; transition: filter 0.5s ease; }
        #game_screen.blurred { filter: blur(18px) brightness(0.3); pointer-events: none; }

        .game-header-banner { text-align: center; margin-bottom: 20px; }
        .game-header-title {
            display: inline-block;
            background: linear-gradient(135deg, rgba(2, 132, 199, 0.9), rgba(37, 99, 235, 0.9));
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 20px;
            padding: 12px 35px;
            font-family: 'Comfortaa', cursive;
            font-size: 1.6rem;
            color: #ffd700;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .teams-bar {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 800;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); border-bottom: 2px solid rgba(255, 255, 255, 0.15);
            padding: 12px 20px; box-shadow: 0 5px 25px rgba(0,0,0,0.6);
            display: flex; justify-content: center; align-items: center;
        }

        .teams-list { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; flex-grow: 1; }

        .team-card {
            background: rgba(255, 255, 255, 0.1); border-radius: 14px; padding: 10px 20px; min-width: 150px; text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.2); transition: all 0.3s ease;
        }

        .team-card.active-turn {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.4), rgba(239, 68, 68, 0.4));
            border-color: #f59e0b; box-shadow: 0 0 25px rgba(245, 158, 11, 0.8);
            transform: scale(1.08); animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.5); }
            100% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.95); }
        }

        .turn-badge { font-size: 0.75rem; font-weight: 800; color: #f59e0b; text-transform: uppercase; display: none; margin-bottom: 4px; }
        .team-card.active-turn .turn-badge { display: block; }

        .team-name { font-weight: 800; font-size: 1rem; color: #fff; }
        .team-score { font-size: 1.6rem; font-weight: 800; color: #38bdf8; }

        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; max-width: 950px; margin: 20px auto; }

        .tile {
            background: linear-gradient(135deg, #0284c7, #2563eb); height: 100px; border-radius: 18px; display: flex;
            align-items: center; justify-content: center; font-size: 2.2rem; font-weight: 800; cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.35); transition: all 0.2s;
        }
        .tile:hover { transform: translateY(-4px) scale(1.04); box-shadow: 0 12px 25px rgba(37, 99, 235, 0.6); }
        .tile.opened { background: rgba(51, 65, 85, 0.8); color: #64748b; cursor: default; transform: none; border-color: transparent; box-shadow: none; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 2000;
        }

        .modal-content {
            background: #0f172a; color: #fff; padding: 35px; border-radius: 24px; max-width: 600px; width: 90%;
            text-align: center; border: 2px solid rgba(255,255,255,0.2); box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }

        .modal-turn-info { font-size: 1rem; color: #f59e0b; font-weight: 800; margin-bottom: 10px; }

        .btn-eval {
            padding: 14px 24px; border-radius: 12px; font-size: 1.1rem; font-weight: 800; border: none; cursor: pointer; margin: 8px; transition: 0.2s;
        }
        .btn-correct { background: #10b981; color: white; }
        .btn-wrong { background: #64748b; color: white; }

        #winner_modal { z-index: 3000; }
        #winner_modal .modal-content {
            background: linear-gradient(135deg, #1e1b4b 0%, #311b92 100%);
            border: 3px solid #f59e0b; box-shadow: 0 0 70px rgba(245, 158, 11, 0.8); animation: winnerPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes winnerPop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .winner-title { font-size: 2.5rem; color: #f59e0b; font-family: 'Comfortaa', cursive; font-weight: 800; }
        .winner-memes { font-size: 3.8rem; margin: 15px 0; letter-spacing: 10px; }
    </style>
</head>
<body>

    <!-- 1. Выбор языка -->
    <div id="lang_screen" class="screen center-box active">
        <div class="card-box">
            <h1 style="font-family:'Comfortaa'; color:#f59e0b; font-size:2rem; margin-bottom:10px;">Select Language / Тилди тандаңыз / Выберите язык</h1>
            <p style="font-size:1rem; opacity:0.8; margin-bottom:30px;">Школьный Блиц-Опрос</p>
            <div style="display:flex; justify-content:center; flex-wrap:wrap;">
                <button class="btn-lang" onclick="selectLanguage('ru')">🇷🇺 Русский</button>
                <button class="btn-lang" onclick="selectLanguage('kg')">🇰🇬 Кыргызча</button>
                <button class="btn-lang" onclick="selectLanguage('en')">🇬🇧 English</button>
            </div>
        </div>
    </div>

    <!-- 2. Главный экран -->
    <div id="welcome_screen" class="screen center-box">
        <div class="card-box">
            <img id="nature_banner" src="https://picsum.photos/800/400?mountain" alt="Nature" class="banner-img">
            <h1 id="welcome_title" style="font-family:'Comfortaa'; margin-bottom:10px; color:#f59e0b; font-size:2.2rem;">Школьный Блиц-Опрос</h1>
            <p id="welcome_desc" style="font-size:1.1rem; opacity:0.8; margin-bottom:30px;">Интеллектуальная командная викторина</p>
            <button id="welcome_btn" class="btn-main" onclick="goToSetup()">НАЧАТЬ</button>
        </div>
    </div>

    <!-- 3. Панель управления -->
    <div id="setup_screen" class="screen center-box">
        <div class="card-box">
            <h2 id="setup_title" style="font-family:'Comfortaa'; color:#38bdf8; margin-top:0; margin-bottom:25px;">⚙️ Панель управления</h2>

            <div class="form-group">
                <label id="lbl_subject" for="subject">📚 Выберите предмет:</label>
                <select id="subject"></select>
            </div>

            <div class="form-group">
                <label id="lbl_grade" for="grade">🏫 Выберите класс:</label>
                <select id="grade"></select>
            </div>

            <div class="form-group">
                <label id="lbl_teams" for="teams_count">👥 Количество команд:</label>
                <select id="teams_count">
                    <option value="" disabled selected id="opt_team_select">-- Выберите --</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>

            <div class="form-group">
                <label id="lbl_topic" for="topic">📝 Тема урока (необязательно):</label>
                <input type="text" id="topic">
            </div>

            <button id="btn_start_game" class="btn-main" style="width:100%; font-size:1.4rem;" onclick="startQuiz()">🚀 Начать игру</button>
        </div>
    </div>

    <!-- 4. Игровое поле -->
    <div id="game_screen">
        <div class="teams-bar">
            <div id="teams_list" class="teams-list"></div>
        </div>

        <div class="game-header-banner">
            <div id="game_header_title" class="game-header-title">Предмет (Класс)</div>
        </div>

        <div id="grid" class="grid"></div>
    </div>

    <!-- Модальное окно вопроса -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div id="modal_turn_info" class="modal-turn-info">🎲 Отвечает: Команда 1</div>
            <h3 id="modal_number" style="color:#38bdf8; margin:5px 0 15px 0;">Вопрос №1</h3>
            
            <p id="modal_question" style="font-size:1.25rem; line-height:1.5; margin:20px 0; min-height:60px;"></p>

            <div id="modal_answer_box" style="display:none; background:rgba(255,255,255,0.08); border-left:4px solid #10b981; padding:15px; border-radius:10px; margin:20px 0; text-align:left;">
                <strong id="lbl_answer_title" style="color:#10b981;">Ответ:</strong> <span id="modal_answer"></span>
            </div>

            <div id="step_show_btn">
                <button id="btn_show_ans" class="btn-main" style="font-size:1.1rem; padding:12px 30px;" onclick="showAnswer()">👁️ Показать ответ</button>
            </div>

            <div id="step_eval_btns" style="display:none; margin-top:15px;">
                <button id="btn_correct" class="btn-eval btn-correct" onclick="submitAnswer(true)">✅ Правильно (+15)</button>
                <button id="btn_wrong" class="btn-eval btn-wrong" onclick="submitAnswer(false)">❌ Неправильно (+0)</button>
            </div>

            <div id="step_surprise_btn" style="display:none; margin-top:15px;">
                <button id="btn_continue" class="btn-main" style="font-size:1.1rem; padding:12px 35px;" onclick="closeSurpriseModal()">Продолжить игру 🚀</button>
            </div>
        </div>
    </div>

    <!-- Экран Победителя -->
    <div id="winner_modal" class="modal">
        <div class="modal-content">
            <div id="winner_title_text" class="winner-title">🏆 Команда 1 победила!</div>
            <div id="winner_memes" class="winner-memes">👑 🏆 🥳 🗿 🚀</div>
            <h2 id="winner_name" style="font-size: 2rem; color: #38bdf8; margin: 10px 0;">Команда 1</h2>
            <p id="winner_score" style="font-size: 1.5rem; font-weight: bold; color: #f59e0b;">Набрано очков: 0</p>
            <button id="btn_restart" class="btn-main" style="font-size:1.2rem; padding:12px 35px; margin-top:20px;" onclick="location.reload()">🎮 Новая игра</button>
        </div>
    </div>

    <script>
        let currentLang = 'ru';
        let tilesData = [];
        let teams = [];
        let currentTurnIndex = 0;
        let openedCount = 0;

        // Гарантированные прямые ссылки на сменяющиеся пейзажи природы
        const NATURE_IMAGES = [

            "https://picsum.photos/id/1043/1200/800"  // Альпийское озеро
        ];

        const subjectsRu = {{ subjects_ru | tojson }};
        const subjectsKg = {{ subjects_kg | tojson }};
        const subjectsEn = {{ subjects_en | tojson }};
        const gradesList = {{ grades | tojson }};

        const TEXTS = {

                errFill: "⚠️ Пожалуйста, заполните все обязательные поля!"
            },
            kg: {
                welcomeTitle: "Мектептик Блиц-Сурамжылоо",
                welcomeDesc: "Командалык интеллектуалдык викторина",
                welcomeBtn: "БАШТОО",
                setupTitle: "⚙️ Башкаруу панели",
                lblSubject: "📚 Предметти тандаңыз:",

                lblTopic: "📝 Сабактын темасы (милдеттүү эмес):",
                phTopic: "Мисалы: 3-чейрек боюнча кайталоо",

                classSuffix: "-класс",

                questionPrefix: "Уяча №",
                showAns: "👁️ Жоопту көрсөтүү",
                ansTitle: "Жообу: ",

                wrongBtn: "❌ Ката (+0)",

                tieDesc: "Командалар тең чыкты!",
                scoreResult: "Топтолгон упай: ",
                newGame: "🎮 Жаңы оюн",
                loading: "🧠 Атайын суроолор даярдалууда... 5-10 секунд күтө түшүңүз!",
                errFill: "⚠️ Сураныч, бардык милдеттүү талааларды толтуруңуз!"
            },

            }
        };

        const MEME_SETS = [
            "👑 🏆 🥳 🗿 🚀 🦄",
            "🎉 🗿 ⚡ 💥 🧠 🏆",
            "🎈 👑 🚀 🔥 😎 🏆",
            "🥳 🤝 🌟 🏆 🎯 ⚡",
            "🗿 🍷 👑 🏆 🚀 💥"
        ];

        function setRandomNatureBackground() {
            const randomImg = NATURE_IMAGES[Math.floor(Math.random() * NATURE_IMAGES.length)];
            document.body.style.backgroundImage = `url('${randomImg}')`;
            document.getElementById('nature_banner').src = randomImg;
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('game_screen').style.display = 'none';

            if (screenId === 'game_screen') {
                document.getElementById('game_screen').style.display = 'block';
            } else {
                document.getElementById(screenId).classList.add('active');
            }
        }

        function selectLanguage(lang) {
            currentLang = lang;
            const t = TEXTS[lang];

            setRandomNatureBackground();

            document.getElementById('welcome_title').innerText = t.welcomeTitle;
            document.getElementById('welcome_desc').innerText = t.welcomeDesc;
            document.getElementById('welcome_btn').innerText = t.welcomeBtn;

            document.getElementById('setup_title').innerText = t.setupTitle;
            document.getElementById('lbl_subject').innerText = t.lblSubject;
            document.getElementById('lbl_grade').innerText = t.lblGrade;
            document.getElementById('lbl_teams').innerText = t.lblTeams;
            document.getElementById('lbl_topic').innerText = t.lblTopic;
            document.getElementById('topic').placeholder = t.phTopic;
            document.getElementById('btn_start_game').innerText = t.btnStartGame;
            document.getElementById('opt_team_select').innerText = t.optSelect;

            document.getElementById('btn_show_ans').innerText = t.showAns;
            document.getElementById('lbl_answer_title').innerText = t.ansTitle;
            document.getElementById('btn_correct').innerText = t.correctBtn;
            document.getElementById('btn_wrong').innerText = t.wrongBtn;
            document.getElementById('btn_continue').innerText = t.continueBtn;
            document.getElementById('btn_restart').innerText = t.newGame;

            const subSelect = document.getElementById('subject');
            subSelect.innerHTML = `<option value="" disabled selected>${t.optSelect}</option>`;
            let list = subjectsRu;
            if (lang === 'kg') list = subjectsKg;
            if (lang === 'en') list = subjectsEn;

            list.forEach(s => {
                subSelect.innerHTML += `<option value="${s}">${s}</option>`;
            });

            const gradeSelect = document.getElementById('grade');
            gradeSelect.innerHTML = `<option value="" disabled selected>${t.optSelect}</option>`;
            gradesList.forEach(g => {
                gradeSelect.innerHTML += `<option value="${g}">${t.classPrefix}${g}${t.classSuffix}</option>`;
            });

            showScreen('welcome_screen');
        }

        function goToSetup() {
            showScreen('setup_screen');
        }

        function renderTeams() {
            const list = document.getElementById('teams_list');
            list.innerHTML = '';
            const t = TEXTS[currentLang];

            teams.forEach((team, idx) => {
                const card = document.createElement('div');
                card.className = `team-card ${idx === currentTurnIndex ? 'active-turn' : ''}`;
                card.id = `team_card_${idx}`;
                card.innerHTML = `
                    <div class="turn-badge">${t.turnBadge}</div>
                    <div class="team-name">${team.name}</div>
                    <div class="team-score" id="score_${idx}">${team.score}</div>
                `;
                list.appendChild(card);
            });
        }

        function updateTurnHighlight() {
            teams.forEach((_, idx) => {
                const card = document.getElementById(`team_card_${idx}`);
                if (card) {
                    if (idx === currentTurnIndex) card.classList.add('active-turn');
                    else card.classList.remove('active-turn');
                }
            });
        }

        async function startQuiz() {
            const t = TEXTS[currentLang];
            const subject = document.getElementById('subject').value;
            const gradeSelect = document.getElementById('grade');
            const gradeText = gradeSelect.options[gradeSelect.selectedIndex].text;
            const gradeVal = gradeSelect.value;
            const teamsCount = document.getElementById('teams_count').value;
            const topic = document.getElementById('topic').value;

            if (!subject || !gradeVal || !teamsCount) {
                alert(t.errFill);
                return;
            }

            document.getElementById('game_header_title').innerText = `📖 ${subject} (${gradeText})`;

            const count = parseInt(teamsCount);
            teams = [];
            for (let i = 1; i <= count; i++) {
                teams.push({ name: `${t.teamPrefix}${i}`, score: 0 });
            }
            currentTurnIndex = 0;
            openedCount = 0;

            document.getElementById('game_screen').classList.remove('blurred');
            showScreen('game_screen');
            renderTeams();

            const grid = document.getElementById('grid');
            grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; font-size:1.4rem; margin-top:50px;">${t.loading}</div>`;

            try {
                const response = await fetch('/generate_quiz', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ lang: currentLang, subject: subject, grade: gradeVal, topic_details: topic })
                });
                const data = await response.json();
                tilesData = data.tiles;

                grid.innerHTML = '';
                tilesData.forEach((tile, index) => {
                    const div = document.createElement('div');
                    div.className = 'tile';
                    div.innerText = tile.number;
                    div.onclick = () => openTile(index, div);
                    grid.appendChild(div);
                });
            } catch (e) {
                grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#ef4444;">Error loading quiz.</div>';
            }
        }

        function openTile(index, element) {
            if (element.classList.contains('opened')) return;
            element.classList.add('opened');
            openedCount++;

            const t = TEXTS[currentLang];
            const currentTile = tilesData[index];
            const activeTeam = teams[currentTurnIndex];

            document.getElementById('modal_turn_info').innerText = `${t.turnInfo}${activeTeam.name}`;
            document.getElementById('modal_number').innerText = `${t.questionPrefix}${currentTile.number}`;

            if (currentTile.type.startsWith('bonus')) {
                const pts = parseInt(currentTile.type.split('_')[1]);
                activeTeam.score += pts;
                document.getElementById(`score_${currentTurnIndex}`).innerText = activeTeam.score;

                document.getElementById('modal_question').innerHTML = `<span style="font-size:2rem;">${t.bonusTitle}</span><br><br>${activeTeam.name} ${t.bonusDesc}${pts}${t.bonusPoints}`;
                document.getElementById('modal_answer_box').style.display = 'none';
                document.getElementById('step_show_btn').style.display = 'none';
                document.getElementById('step_eval_btns').style.display = 'none';
                document.getElementById('step_surprise_btn').style.display = 'block';

                document.getElementById('modal').style.display = 'flex';
                return;
            } else if (currentTile.type.startsWith('penalty')) {
                const pts = parseInt(currentTile.type.split('_')[1]);
                activeTeam.score -= pts;
                document.getElementById(`score_${currentTurnIndex}`).innerText = activeTeam.score;

                document.getElementById('modal_question').innerHTML = `<span style="font-size:2rem; color:#ef4444;">${t.penaltyTitle}</span><br><br>${activeTeam.name} ${t.penaltyDesc}${pts}${t.bonusPoints}`;
                document.getElementById('modal_answer_box').style.display = 'none';
                document.getElementById('step_show_btn').style.display = 'none';
                document.getElementById('step_eval_btns').style.display = 'none';
                document.getElementById('step_surprise_btn').style.display = 'block';

                document.getElementById('modal').style.display = 'flex';
                return;
            }

            document.getElementById('modal_question').innerText = currentTile.question;
            document.getElementById('modal_answer').innerText = currentTile.answer;

            document.getElementById('modal_answer_box').style.display = 'none';
            document.getElementById('step_show_btn').style.display = 'block';
            document.getElementById('step_eval_btns').style.display = 'none';
            document.getElementById('step_surprise_btn').style.display = 'none';

            document.getElementById('modal').style.display = 'flex';
        }

        function showAnswer() {
            document.getElementById('modal_answer_box').style.display = 'block';
            document.getElementById('step_show_btn').style.display = 'none';
            document.getElementById('step_eval_btns').style.display = 'block';
        }

        function submitAnswer(isCorrect) {
            const points = isCorrect ? 15 : 0;
            teams[currentTurnIndex].score += points;

            document.getElementById(`score_${currentTurnIndex}`).innerText = teams[currentTurnIndex].score;

            currentTurnIndex = (currentTurnIndex + 1) % teams.length;
            updateTurnHighlight();

            document.getElementById('modal').style.display = 'none';

            // Автоматическое завершение после открытия всех 20 карточек
            if (openedCount >= 20) {
                setTimeout(finishGame, 400);
            }
        }

        function closeSurpriseModal() {
            currentTurnIndex = (currentTurnIndex + 1) % teams.length;
            updateTurnHighlight();
            document.getElementById('modal').style.display = 'none';

            if (openedCount >= 20) {
                setTimeout(finishGame, 400);
            }
        }

        function finishGame() {
            const t = TEXTS[currentLang];
            let maxScore = -9999;
            let winners = [];

            teams.forEach(tm => {
                if (tm.score > maxScore) {
                    maxScore = tm.score;
                    winners = [tm];
                } else if (tm.score === maxScore) {
                    winners.push(tm);
                }
            });

            const randomMemes = MEME_SETS[Math.floor(Math.random() * MEME_SETS.length)];
            document.getElementById('winner_memes').innerText = randomMemes;

            if (winners.length > 1 || teams.length === 0) {
                document.getElementById('winner_title_text').innerText = t.tieTitle;
                document.getElementById('winner_name').innerText = t.tieDesc;
                document.getElementById('winner_score').innerText = `${t.scoreResult}${maxScore}`;
            } else {
                document.getElementById('winner_title_text').innerText = `🏆 ${winners[0].name}${t.winTitle}`;
                document.getElementById('winner_name').innerText = winners[0].name;
                document.getElementById('winner_score').innerText = `${t.scoreResult}${maxScore}`;
            }

            document.getElementById('game_screen').classList.add('blurred');

            playWinSound();
            launchFireworks();

            document.getElementById('winner_modal').style.display = 'flex';
        }

        function launchFireworks() {
            var duration = 4 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({ particleCount: 9, angle: 60, spread: 65, origin: { x: 0 } });
                confetti({ particleCount: 9, angle: 120, spread: 65, origin: { x: 1 } });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        function playWinSound() {
            try {
                let ctx = new (window.AudioContext || window.webkitAudioContext)();
                let notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    let osc = ctx.createOscillator();
                    let gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.3, ctx.currentTime + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + idx * 0.1 + 0.5);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + idx * 0.1);
                    osc.stop(ctx.currentTime + idx * 0.1 + 0.5);
                });
            } catch(e) {}
        }
    </script>
</body>
</html>
